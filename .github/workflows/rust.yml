name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # --workspace is required: the root is a virtual manifest with
    # default-members = ["views/cli"], so a bare `cargo build` would only
    # cover the CLI and silently skip every library crate and its tests.
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Formatting
      run: cargo fmt --all --check
