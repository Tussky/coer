name: Agent Mention

# Message an agent from a pull request or issue. Comment "@claude ..." and it
# replies in a comment on the same thread.
#
#   @claude use the security-reviewer agent on src/auth.rs
#   @claude why is the panel calling this a blocker?
#   @claude /next
#
# Requires repository secret CLAUDE_CODE_OAUTH_TOKEN (see: claude setup-token).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  respond:
    # Don't start a runner for comments that aren't addressed to Claude.
    # The action re-checks the trigger phrase itself before responding.
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on the pull request

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
